<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title></title>
    <link rel="stylesheet" href="katex/katex.min.css">
    <link rel="stylesheet" href="pele-theme.css">
    <link rel="stylesheet" href="chart/chart-preview.css">
    <link rel="stylesheet" href="agent-chat.css">
    <script src="katex/katex.min.js" defer></script>
    <script type="module" src="agent-chat.js"></script>
</head>
<body>
    <main id="history">
        <div id="messages" class="conversation"></div>
    </main>
    <aside class="turn-panel">
        <section class="turn-section">
            <div class="turn-header">
                <h2 id="turn-title"></h2>
                <button id="copy-all" class="message-copy" type="button" aria-live="polite" disabled>
                    <span id="copy-all-icon" aria-hidden="true">⧉</span>
                    <span id="copy-all-text"></span>
                </button>
            </div>
            <nav id="turns" aria-labelledby="turn-title"></nav>
        </section>
        <section class="turn-section session-section">
            <div class="turn-header">
                <h2 id="sessions-title"></h2>
                <div class="session-actions">
                    <button id="new-session" class="message-copy" type="button" disabled>
                        <span aria-hidden="true">+</span>
                    </button>
                    <button id="close-all-sessions" class="message-copy" type="button" disabled>
                        <span class="trash-icon" aria-hidden="true">&#xE74D;</span>
                    </button>
                </div>
            </div>
            <nav id="sessions" aria-labelledby="sessions-title"></nav>
            <p id="sessions-empty" hidden></p>
        </section>
    </aside>
    <form id="composer" class="composer" hidden>
        <div id="attachment-bar" class="composer-attachment-bar" hidden>
            <div id="attachments" class="composer-attachments"></div>
        </div>
        <div id="chip-bar" class="composer-chip-bar" hidden>
            <div id="chips" class="composer-chips"></div>
            <button id="clear-chips" class="composer-chips-clear" type="button">
                <span aria-hidden="true">&#x2715;</span>
            </button>
        </div>
        <div class="composer-row">
            <textarea id="prompt" rows="1" spellcheck="false" disabled></textarea>
            <button id="clear-prompt" class="composer-clear" type="button" hidden>
                <span aria-hidden="true">&#x2715;</span>
            </button>
            <button id="send" type="submit" disabled>
                <span id="send-icon" aria-hidden="true">↑</span>
            </button>
        </div>
    </form>
    <div id="slash-palette" class="slash-palette" role="listbox" hidden></div>
    <div id="attach-hint" class="attach-hint" aria-hidden="true" hidden>
        <span id="attach-hint-text"></span>
    </div>
</body>
</html>
