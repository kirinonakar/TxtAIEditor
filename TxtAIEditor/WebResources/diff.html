<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TxtAIEditor File Compare</title>
    <style>
        :root {
            --bg: transparent; /* Start transparent to prevent dark flashes on load */
            --fg: #d4d4d4;
            --border: #3e3e3e;
            --header-bg: #252526;
            --gutter-bg: #1e1e1e;
            --gutter-fg: #858585;
            --added-bg: rgba(46, 160, 67, 0.15);
            --added-border: rgba(46, 160, 67, 0.4);
            --added-text: #3fb950;
            --added-change-bg: rgba(46, 160, 67, 0.4);
            --removed-bg: rgba(248, 81, 73, 0.15);
            --removed-border: rgba(248, 81, 73, 0.4);
            --removed-text: #f85149;
            --removed-change-bg: rgba(248, 81, 73, 0.4);
            --empty-bg: #171717;
            --font-family: Consolas, "Courier New", monospace;
            --ui-font: "Segoe UI", "Malgun Gothic", sans-serif;
            --scrollmap-width: 14px;
            --diff-columns: minmax(0, 1fr) var(--scrollmap-width) minmax(0, 1fr) var(--scrollmap-width);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --fg: #1a1a1a;
                --border: #e1e4e8;
                --header-bg: #f3f3f3;
                --gutter-bg: #f3f3f3;
                --gutter-fg: #6a737d;
                --added-text: #22863a;
                --removed-text: #cb2431;
                --empty-bg: #f9f9f9;
            }
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--ui-font);
        }

        #container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        #title-bar {
            display: flex;
            justify-content: space-between;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
        }

        #diff-panels {
            display: grid;
            grid-template-columns: var(--diff-columns);
            grid-template-rows: 24px minmax(0, 1fr) var(--scrollmap-width);
            flex: 1;
            min-height: 0;
            overflow: hidden;
            width: 100%;
        }

        #left-header {
            grid-column: 1 / span 2;
            grid-row: 1;
            border-right: 1px solid var(--border);
        }

        #right-header {
            grid-column: 3 / span 2;
            grid-row: 1;
        }

        .panel-header {
            flex: 0 0 24px;
            height: 24px;
            background: var(--header-bg);
            padding: 0 8px;
            display: flex;
            align-items: center;
            font-size: 12px;
            line-height: 18px;
            color: var(--gutter-fg);
            border-bottom: 1px solid var(--border);
            font-family: var(--ui-font);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .panel-header-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: inherit;
        }

        .open-file-btn {
            display: inline-flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--gutter-fg);
            cursor: pointer;
            padding: 2px 6px;
            margin: 0;
            border-radius: 4px;
            transition: background 0.15s, color 0.15s;
        }
        .open-file-btn:hover {
            background: rgba(128, 128, 128, 0.2);
            color: var(--fg);
        }

        #diff-message {
            color: var(--removed-text);
            max-width: 55%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #right-view .line-number {
            flex-basis: 76px;
            width: 76px;
            padding-left: 26px;
        }
        #chunk-actions {
            position: absolute;
            top: 0;
            left: 0;
            width: 26px;
            height: 100%;
            pointer-events: none;
        }
        .revert-chunk-btn {
            position: absolute;
            left: 2px;
            width: 22px;
            height: 20px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--header-bg);
            color: var(--fg);
            font-size: 16px;
            line-height: 16px;
            cursor: pointer;
            pointer-events: auto;
        }
        .revert-chunk-btn:hover { background: var(--added-change-bg); }
        .revert-chunk-btn:focus-visible { outline: 2px solid var(--fg); }
        .revert-chunk-btn:disabled { opacity: 0.4; cursor: wait; }

        /* One native scroll surface moves both panes in the same compositor
           update. Headers, markers and horizontal controls stay outside it. */
        #vertical-wrapper {
            grid-column: 1 / -1;
            grid-row: 2;
            min-width: 0;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
            overflow-anchor: none;
            position: relative;
            background: var(--bg);
            outline: none;
        }
        #vertical-wrapper::-webkit-scrollbar {
            width: 0;
            height: 0;
        }
        .diff-canvas {
            display: grid;
            grid-template-columns: var(--diff-columns);
            height: 0;
            position: relative;
        }

        .view-wrapper {
            min-width: 0;
            min-height: 0;
            overflow: clip;
            position: relative;
            background: var(--bg);
        }
        #left-wrapper { grid-column: 1; }
        #right-wrapper { grid-column: 3; }
        #left-scrollmap { grid-column: 2; border-right: 1px solid var(--border); }
        #right-scrollmap { grid-column: 4; }
        #left-horizontal { grid-column: 1; }
        #right-horizontal { grid-column: 3; }
        /* The thumb and both text layers share one horizontal position. */
        .horizontal-scrollbar {
            grid-row: 3;
            min-width: 0;
            position: relative;
            overflow: hidden;
            background: var(--bg);
            touch-action: none;
            user-select: none;
            outline: none;
        }
        .horizontal-thumb {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            pointer-events: none;
            background: rgba(121, 121, 121, 0.4);
            border-radius: 4px;
            will-change: transform;
        }
        .horizontal-scrollbar:hover .horizontal-thumb,
        .horizontal-scrollbar:focus-visible .horizontal-thumb {
            background: rgba(121, 121, 121, 0.6);
        }

        .diff-view {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            background: var(--bg);
            will-change: transform;
            font-family: var(--font-family);
            font-size: 13px;
            line-height: 20px;
        }

        .diff-row {
            display: flex;
            height: 20px;
        }

        .line-number {
            flex: 0 0 50px;
            width: 50px;
            text-align: right;
            padding-right: 10px;
            color: var(--gutter-fg);
            background: var(--gutter-bg);
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
            border-right: 1px solid var(--border);
            height: 20px;
            box-sizing: border-box;
        }

        .line-content {
            flex: 1;
            min-width: 0;
            padding-left: 12px;
            white-space: pre;
            overflow: visible;
            height: 20px;
            box-sizing: border-box;
            vertical-align: middle;
        }

        .diff-sign {
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
        }

        /* Diff styling states */
        .row-added {
            background: var(--added-bg);
        }
        .row-added .line-content {
            color: var(--added-text);
            background: rgba(46, 160, 67, 0.08);
            border-left: 3px solid var(--added-border);
        }

        .row-removed {
            background: var(--removed-bg);
        }
        .row-removed .line-content {
            color: var(--removed-text);
            background: rgba(248, 81, 73, 0.08);
            border-left: 3px solid var(--removed-border);
        }

        .row-added .inline-change {
            background: var(--added-change-bg);
            color: var(--fg);
        }
        .row-removed .inline-change {
            background: var(--removed-change-bg);
            color: var(--fg);
        }

        .row-empty {
            background: var(--empty-bg);
            user-select: none;
        }
        .row-empty .line-number {
            color: transparent;
            background: var(--empty-bg);
        }

        #change-tooltip {
            position: fixed;
            z-index: 100;
            width: max-content;
            max-width: calc(100vw - 24px);
            max-height: min(70vh, 640px);
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--header-bg);
            color: var(--fg);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            font-size: 13px;
            line-height: 20px;
            pointer-events: auto;
        }
        .tooltip-section + .tooltip-section { margin-top: 10px; }
        .tooltip-heading {
            margin-bottom: 4px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }
        .tooltip-line {
            padding: 0 6px;
            font-family: var(--font-family);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            tab-size: 4;
        }
        .tooltip-line.row-removed { color: var(--removed-text); }
        .tooltip-line.row-added { color: var(--added-text); }

        /* ── Scrollmap (custom scrollbar with diff markers) ── */
        .scrollmap {
            grid-row: 2;
            width: var(--scrollmap-width);
            height: 100%;
            position: relative;
            flex-shrink: 0;
            background: rgba(128, 128, 128, 0.08);  /* 배경을 아주 옅게 */
            border-left: 1px solid var(--border);
            cursor: pointer;
            overflow: hidden;
        }

        /* Coloured markers rendered absolutely inside the scrollmap */
        .scrollmap-marker {
            position: absolute;
            left: 1px;
            right: 1px;
            min-height: 2px;
            border-radius: 1px;
            pointer-events: none;
            z-index: 1;
        }
        .scrollmap-marker.added {
            background: rgba(46, 160, 67, 0.8);
        }
        .scrollmap-marker.removed {
            background: rgba(248, 81, 73, 0.8);
        }

        /* Viewport thumb — shows the current visible region */
        .scrollmap-thumb {
            position: absolute;
            left: 0;
            right: 0;
            background: rgba(160, 160, 160, 0.25);
            border-top: 2px solid rgba(200, 200, 200, 0.7);
            border-bottom: 2px solid rgba(200, 200, 200, 0.7);
            border-radius: 2px;
            pointer-events: none;
            z-index: 10;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="title-bar">
            <span id="diff-title">TxtAIEditor 파일 비교 도구 (File Compare)</span>
            <span id="diff-message" role="status" aria-live="polite" hidden></span>
            <span id="diff-stats" style="font-weight: normal; color: var(--gutter-fg);">수집 중...</span>
        </div>
        <div id="diff-panels">
            <div class="panel-header" id="left-header">원본 파일 (Original)</div>
            <div class="panel-header" id="right-header">
                <span class="panel-header-text" id="right-header-text">비교 대상 파일 (Modified)</span>
                <button class="open-file-btn" id="right-open-btn" title="파일 열기" onclick="openRightFile()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>
            </div>
            <div id="vertical-wrapper" tabindex="0" aria-labelledby="diff-title">
                <div class="diff-canvas" id="diff-canvas">
                    <div class="view-wrapper" id="left-wrapper">
                        <div class="diff-view" id="left-view"></div>
                    </div>
                    <div class="view-wrapper" id="right-wrapper">
                        <div class="diff-view" id="right-view"></div>
                        <div id="chunk-actions"></div>
                    </div>
                </div>
            </div>
            <div class="scrollmap" id="left-scrollmap">
                <div class="scrollmap-thumb" id="left-thumb"></div>
            </div>
            <div class="scrollmap" id="right-scrollmap">
                <div class="scrollmap-thumb" id="right-thumb"></div>
            </div>
            <div class="horizontal-scrollbar" id="left-horizontal" role="scrollbar" aria-orientation="horizontal" aria-controls="left-view" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0" aria-labelledby="left-header">
                <div class="horizontal-thumb" id="left-horizontal-thumb"></div>
            </div>
            <div class="horizontal-scrollbar" id="right-horizontal" role="scrollbar" aria-orientation="horizontal" aria-controls="right-view" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0" aria-labelledby="right-header-text">
                <div class="horizontal-thumb" id="right-horizontal-thumb"></div>
            </div>
        </div>
    </div>
    <div id="change-tooltip" role="tooltip" hidden></div>

    <script>
        const leftWrapper  = document.getElementById('left-wrapper');
        const rightWrapper = document.getElementById('right-wrapper');
        const verticalWrapper = document.getElementById('vertical-wrapper');
        const diffCanvas = document.getElementById('diff-canvas');
        const leftView     = document.getElementById('left-view');
        const rightView    = document.getElementById('right-view');
        const leftScrollmap  = document.getElementById('left-scrollmap');
        const rightScrollmap = document.getElementById('right-scrollmap');
        const leftThumb  = document.getElementById('left-thumb');
        const rightThumb = document.getElementById('right-thumb');
        const leftHorizontal = document.getElementById('left-horizontal');
        const rightHorizontal = document.getElementById('right-horizontal');
        const leftHorizontalThumb = document.getElementById('left-horizontal-thumb');
        const rightHorizontalThumb = document.getElementById('right-horizontal-thumb');

        // Virtual scroll parameters
        const rowHeight = 20;
        let globalDiffA = [];
        let globalDiffB = [];
        let maxLineLength = 0;
        const charWidth = 8.5;
        let horizontalOffset = 0;
        let horizontalMax = 0;
        let measuredFont = '';
        let measuredContentWidth = 0;
        const horizontalMetrics = new Map();

        // Prevent dragging duplicate windows
        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop',     e => e.preventDefault());

        // ── Right panel file open ────────────────────────────────────────
        let rightFilePath = '';

        // 현재 보이는 영역의 중앙 줄 번호(수정본 기준)를 반환한다.
        function getCurrentRightLine() {
            const totalRows = globalDiffB.length;
            if (totalRows === 0) return 0;

            const centerY = verticalWrapper.scrollTop + verticalWrapper.clientHeight / 2;
            const centerIndex = Math.min(
                totalRows - 1,
                Math.max(0, Math.floor(centerY / rowHeight)));

            for (let k = centerIndex; k < totalRows; k++) {
                const item = globalDiffB[k];
                if (item && item.lineNum) return item.lineNum;
            }
            for (let k = centerIndex - 1; k >= 0; k--) {
                const item = globalDiffB[k];
                if (item && item.lineNum) return item.lineNum;
            }
            return 0;
        }

        function openRightFile() {
            if (rightFilePath) {
                post({ type: 'openFile', path: rightFilePath, lineNumber: getCurrentRightLine() });
            }
        }

        // ── Keyboard shortcut forwarding ──────────────────────────────────
        function post(msg) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(msg);
            }
        }

        window.addEventListener('keydown', event => {
            if (event.key === 'F3') {
                event.preventDefault();
                post({ type: 'shortcut', name: 'f3' });
            } else if (event.key === 'F4') {
                event.preventDefault();
                post({ type: 'shortcut', name: 'f4' });
            } else if (event.key === 'F7') {
                event.preventDefault();
                event.stopPropagation();
                event.stopImmediatePropagation();
            } else if (event.key === 'F9') {
                event.preventDefault();
                post({ type: 'shortcut', name: 'f9' });
            } else if (event.key === 'F10') {
                event.preventDefault();
                post({ type: 'shortcut', name: 'f10' });
            } else if (event.key === 'F11') {
                event.preventDefault();
                post({ type: 'shortcut', name: 'f11' });
            } else if (event.key === 'F12') {
                event.preventDefault();
                post({ type: 'shortcut', name: 'f12' });
            } else {
                const ctrl = event.ctrlKey || event.metaKey;
                const key = event.key ? event.key.toLowerCase() : '';
                if (ctrl && key === '3') {
                    event.preventDefault();
                    post({ type: 'shortcut', name: 'expandRightPanel' });
                } else if (ctrl && key === 'w') {
                    event.preventDefault();
                    post({ type: 'shortcut', name: 'closeTab' });
                }
            }
        });

        // ── Myers' diff comparison logic ──────────────────────────────────
        function computeLineDiff(textA, textB) {
            const linesA = textA === "" ? [] : textA.split(/\r?\n/);
            const linesB = textB === "" ? [] : textB.split(/\r?\n/);

            const N = linesA.length;
            const M = linesB.length;

            const max = N + M;
            const v = { 1: 0 };
            const history = [];

            let found = false;
            let x, y;

            const maxD = Math.min(2000, max); 

            for (let d = 0; d <= maxD; d++) {
                history.push(Object.assign({}, v));
                for (let k = -d; k <= d; k += 2) {
                    if (k === -d || (k !== d && v[k - 1] < v[k + 1])) {
                        x = v[k + 1];
                    } else {
                        x = v[k - 1] + 1;
                    }
                    y = x - k;

                    while (x < N && y < M && linesA[x] === linesB[y]) {
                        x++;
                        y++;
                    }

                    v[k] = x;

                    if (x >= N && y >= M) {
                        found = true;
                        break;
                    }
                }
                if (found) {
                    history.push(Object.assign({}, v));
                    break;
                }
            }

            const diffA = [];
            const diffB = [];

            if (!found) {
                let i = 0;
                let j = 0;
                while (i < N || j < M) {
                    if (i < N && j < M) {
                        if (linesA[i] === linesB[j]) {
                            diffA.push({ type: 'unchanged', text: linesA[i], lineNum: i + 1 });
                            diffB.push({ type: 'unchanged', text: linesB[j], lineNum: j + 1 });
                            i++; j++;
                        } else {
                            diffA.push({ type: 'removed', text: linesA[i], lineNum: i + 1 });
                            diffB.push({ type: 'empty', text: '', lineNum: null });
                            diffA.push({ type: 'empty', text: '', lineNum: null });
                            diffB.push({ type: 'added', text: linesB[j], lineNum: j + 1 });
                            i++; j++;
                        }
                    } else if (i < N) {
                        diffA.push({ type: 'removed', text: linesA[i], lineNum: i + 1 });
                        diffB.push({ type: 'empty', text: '', lineNum: null });
                        i++;
                    } else if (j < M) {
                        diffA.push({ type: 'empty', text: '', lineNum: null });
                        diffB.push({ type: 'added', text: linesB[j], lineNum: j + 1 });
                        j++;
                    }
                }
                return { diffA, diffB };
            }

            let currX = N;
            let currY = M;
            const depth = history.length - 2;

            for (let d = depth; d >= 1; d--) {
                const vAtD = history[d]; 
                const k = currX - currY;

                const getV = (kVal) => (vAtD[kVal] !== undefined ? vAtD[kVal] : -1);

                let prevK;
                if (k === -d || (k !== d && getV(k - 1) < getV(k + 1))) {
                    prevK = k + 1;
                } else {
                    prevK = k - 1;
                }

                const prevX = getV(prevK);
                const prevY = prevX - prevK;

                while (currX > prevX && currY > prevY) {
                    diffA.unshift({ type: 'unchanged', text: linesA[currX - 1], lineNum: currX });
                    diffB.unshift({ type: 'unchanged', text: linesB[currY - 1], lineNum: currY });
                    currX--;
                    currY--;
                }

                if (currX > prevX) {
                    diffA.unshift({ type: 'removed', text: linesA[currX - 1], lineNum: currX });
                    diffB.unshift({ type: 'empty', text: '', lineNum: null });
                    currX--;
                } else if (currY > prevY) {
                    diffA.unshift({ type: 'empty', text: '', lineNum: null });
                    diffB.unshift({ type: 'added', text: linesB[currY - 1], lineNum: currY });
                    currY--;
                }
            }

            while (currX > 0 && currY > 0) {
                diffA.unshift({ type: 'unchanged', text: linesA[currX - 1], lineNum: currX });
                diffB.unshift({ type: 'unchanged', text: linesB[currY - 1], lineNum: currY });
                currX--;
                currY--;
            }

            return { diffA, diffB };
        }

        // Keep grapheme clusters intact (including combining marks and emoji).
        const diffSegmenter = new Intl.Segmenter(undefined, { granularity: 'grapheme' });

        function computeInlineDiff(textA, textB, budget) {
            const a = Array.from(diffSegmenter.segment(textA), part => part.segment);
            const b = Array.from(diffSegmenter.segment(textB), part => part.segment);
            let prefix = 0;
            while (prefix < a.length && prefix < b.length && a[prefix] === b[prefix]) prefix++;
            let endA = a.length;
            let endB = b.length;
            while (endA > prefix && endB > prefix && a[endA - 1] === b[endB - 1]) {
                endA--;
                endB--;
            }

            const matches = [];
            for (let i = 0; i < prefix; i++) matches.push([i, i]);
            const n = endA - prefix;
            const m = endB - prefix;
            const cells = (n + 1) * (m + 1);
            // Bound both memory and total work; long replacements still retain
            // their common prefix/suffix and never block on a quadratic matrix.
            if (n > 0 && m > 0 && cells <= 250000 && cells <= budget.cells) {
                budget.cells -= cells;
                const width = m + 1;
                const lcs = new Uint32Array(cells);
                for (let i = n - 1; i >= 0; i--) {
                    for (let j = m - 1; j >= 0; j--) {
                        lcs[i * width + j] = a[prefix + i] === b[prefix + j]
                            ? 1 + lcs[(i + 1) * width + j + 1]
                            : Math.max(lcs[(i + 1) * width + j], lcs[i * width + j + 1]);
                    }
                }
                let i = 0;
                let j = 0;
                while (i < n && j < m) {
                    if (a[prefix + i] === b[prefix + j]) {
                        matches.push([prefix + i++, prefix + j++]);
                    } else if (lcs[(i + 1) * width + j] >= lcs[i * width + j + 1]) {
                        i++;
                    } else {
                        j++;
                    }
                }
            }
            for (let i = endA, j = endB; i < a.length; i++, j++) matches.push([i, j]);

            function changedRanges(parts, side) {
                const offsets = [0];
                for (const part of parts) offsets.push(offsets[offsets.length - 1] + part.length);
                const ranges = [];
                let start = 0;
                for (const match of matches) {
                    const index = match[side];
                    if (start < index) ranges.push([offsets[start], offsets[index]]);
                    start = index + 1;
                }
                if (start < parts.length) ranges.push([offsets[start], offsets[parts.length]]);
                return ranges;
            }

            const weight = part => /\S/u.test(part) ? 1 : 0;
            const total = Math.max(a.reduce((sum, part) => sum + weight(part), 0),
                b.reduce((sum, part) => sum + weight(part), 0));
            const shared = matches.reduce((sum, match) => sum + weight(a[match[0]]), 0);
            return {
                rangesA: changedRanges(a, 0),
                rangesB: changedRanges(b, 1),
                similarity: total === 0 ? 1 : shared / total
            };
        }

        // Align replacement lines within each hunk, allowing inserted/deleted
        // lines between them. Both virtual panels then share the same row index.
        function alignChangedLines(diffA, diffB) {
            const alignedA = [];
            const alignedB = [];
            const empty = () => ({ type: 'empty', text: '', lineNum: null });
            const budget = { cells: 2000000 };
            let start = 0;
            while (start < diffA.length) {
                if (diffA[start].type === 'unchanged' && diffB[start].type === 'unchanged') {
                    alignedA.push(diffA[start]);
                    alignedB.push(diffB[start++]);
                    continue;
                }
                let end = start;
                const removed = [];
                const added = [];
                while (end < diffA.length &&
                    (diffA[end].type !== 'unchanged' || diffB[end].type !== 'unchanged')) {
                    if (diffA[end].type === 'removed') removed.push(diffA[end]);
                    if (diffB[end].type === 'added') added.push(diffB[end]);
                    end++;
                }

                function appendPair(i, j, change) {
                    removed[i].changes = change.rangesA;
                    added[j].changes = change.rangesB;
                    alignedA.push(removed[i]);
                    alignedB.push(added[j]);
                }

                const n = removed.length;
                const m = added.length;
                if (n * m > 4096) {
                    // A bounded lookahead keeps large hunks responsive while
                    // still aligning replacements across nearby insertions.
                    let i = 0;
                    let j = 0;
                    while (i < n || j < m) {
                        let best = null;
                        function consider(a, b) {
                            const change = computeInlineDiff(removed[a].text, added[b].text, budget);
                            if (change.similarity < 0.35) return;
                            const cost = 2 * (1 - change.similarity) + 0.15 * (a - i + b - j);
                            if (!best || cost < best.cost) best = { a, b, change, cost };
                        }
                        if (i < n && j < m) {
                            consider(i, j);
                            for (let gap = 1; gap <= 8; gap++) {
                                if (i + gap < n) consider(i + gap, j);
                                if (j + gap < m) consider(i, j + gap);
                            }
                        }
                        if (best) {
                            while (i < best.a) {
                                alignedA.push(removed[i++]);
                                alignedB.push(empty());
                            }
                            while (j < best.b) {
                                alignedA.push(empty());
                                alignedB.push(added[j++]);
                            }
                            appendPair(i++, j++, best.change);
                        } else {
                            if (i < n) {
                                alignedA.push(removed[i++]);
                                alignedB.push(empty());
                            }
                            if (j < m) {
                                alignedA.push(empty());
                                alignedB.push(added[j++]);
                            }
                        }
                    }
                } else {
                    const width = m + 1;
                    const costs = new Float64Array((n + 1) * width);
                    const changes = new Map();
                    for (let i = n; i >= 0; i--) {
                        for (let j = m; j >= 0; j--) {
                            const index = i * width + j;
                            if (i === n) { costs[index] = m - j; continue; }
                            if (j === m) { costs[index] = n - i; continue; }
                            const change = computeInlineDiff(removed[i].text, added[j].text, budget);
                            // Whitespace alone must not pair unrelated code lines.
                            const pairCost = (n === 1 && m === 1) || change.similarity >= 0.35
                                ? 2 * (1 - change.similarity) : Infinity;
                            changes.set(index, { change, pairCost });
                            costs[index] = Math.min(pairCost + costs[(i + 1) * width + j + 1],
                                1 + costs[(i + 1) * width + j], 1 + costs[index + 1]);
                        }
                    }
                    let i = 0;
                    let j = 0;
                    while (i < n || j < m) {
                        const index = i * width + j;
                        const candidate = changes.get(index);
                        if (i < n && j < m && candidate.pairCost + costs[(i + 1) * width + j + 1] <= costs[index] + 1e-9) {
                            appendPair(i++, j++, candidate.change);
                        } else if (i < n && (j === m || costs[(i + 1) * width + j] <= costs[index + 1])) {
                            alignedA.push(removed[i++]);
                            alignedB.push(empty());
                        } else {
                            alignedA.push(empty());
                            alignedB.push(added[j++]);
                        }
                    }
                }
                start = end;
            }
            return { diffA: alignedA, diffB: alignedB };
        }

        // Contiguous changed rows form one revertible chunk, including rows
        // padded on either side by the replacement-line alignment.
        function buildDiffChunks(diffA, diffB) {
            const chunks = [];
            let originalLine = 0;
            let modifiedLine = 0;
            let chunk = null;
            for (let row = 0; row < diffA.length; row++) {
                const changed = diffA[row].type !== 'unchanged' || diffB[row].type !== 'unchanged';
                if (changed && !chunk) {
                    chunk = { rowStart: row, rowEnd: row, originalStart: originalLine,
                        modifiedStart: modifiedLine, originalCount: 0, modifiedCount: 0 };
                    chunks.push(chunk);
                }
                const hasA = diffA[row].type !== 'empty';
                const hasB = diffB[row].type !== 'empty';
                if (changed) {
                    chunk.rowEnd = row;
                    if (hasA) chunk.originalCount++;
                    if (hasB) chunk.modifiedCount++;
                } else {
                    chunk = null;
                }
                if (hasA) originalLine++;
                if (hasB) modifiedLine++;
            }
            return chunks;
        }

        let comparisonData = null;
        let diffChunks = [];
        let revertPending = false;
        const chunkButtons = new Map();

        // Look up the complete change, including rows outside the virtual DOM.
        const changeTooltip = document.getElementById('change-tooltip');
        let tooltipRow = null;
        let tooltipChunk = null;
        let tooltipShowTimer = 0;
        let tooltipHideTimer = 0;

        function hideChangeTooltip() {
            clearTimeout(tooltipShowTimer);
            clearTimeout(tooltipHideTimer);
            tooltipRow?.removeAttribute('aria-describedby');
            tooltipRow = null;
            tooltipChunk = null;
            changeTooltip.hidden = true;
            changeTooltip.replaceChildren();
        }

        function findDiffChunk(rowIndex) {
            let low = 0;
            let high = diffChunks.length;
            while (low < high) {
                const middle = (low + high) >>> 1;
                if (diffChunks[middle].rowEnd < rowIndex) low = middle + 1;
                else high = middle;
            }
            const chunk = diffChunks[low];
            return chunk && chunk.rowStart <= rowIndex ? chunk : null;
        }

        function showChangeTooltip(row, chunk) {
            const content = document.createDocumentFragment();
            for (const [items, type, header] of [
                [globalDiffA, 'removed', 'left-header'],
                [globalDiffB, 'added', 'right-header-text']
            ]) {
                const section = document.createElement('div');
                section.className = 'tooltip-section';
                const heading = document.createElement('div');
                heading.className = 'tooltip-heading';
                // Reuse the localized labels supplied by the host.
                heading.textContent = document.getElementById(header).textContent;
                section.append(heading);
                for (let index = chunk.rowStart; index <= chunk.rowEnd; index++) {
                    const item = items[index];
                    if (item.type !== type) continue;
                    const line = document.createElement('div');
                    line.className = `tooltip-line row-${type}`;
                    line.innerHTML = `<span class="diff-sign">${type === 'removed' ? '- ' : '+ '}</span>${renderLineText(item)}`;
                    section.append(line);
                }
                if (section.childElementCount > 1) content.append(section);
            }
            changeTooltip.replaceChildren(content);
            changeTooltip.hidden = false;
            changeTooltip.scrollTop = 0;
            changeTooltip.style.left = '12px';
            changeTooltip.style.top = '12px';
            const rect = row.getBoundingClientRect();
            const size = changeTooltip.getBoundingClientRect();
            const below = rect.bottom + 6;
            const above = rect.top - size.height - 6;
            const top = below + size.height <= window.innerHeight - 12 ? below :
                (above >= 12 ? above : Math.max(12, window.innerHeight - size.height - 12));
            changeTooltip.style.top = `${top}px`;
            changeTooltip.style.left = `${Math.max(12, Math.min(rect.left, window.innerWidth - size.width - 12))}px`;
            row.setAttribute('aria-describedby', 'change-tooltip');
        }

        function scheduleTooltipHide() {
            clearTimeout(tooltipShowTimer);
            clearTimeout(tooltipHideTimer);
            tooltipHideTimer = setTimeout(hideChangeTooltip, 150);
        }

        for (const view of [leftView, rightView]) {
            view.addEventListener('pointerover', event => {
                if (event.pointerType === 'touch' || event.buttons) return;
                const row = event.target.closest('.diff-row');
                if (!row || row.contains(event.relatedTarget)) return;
                clearTimeout(tooltipHideTimer);
                const chunk = row.dataset.rowIndex === undefined ? null :
                    findDiffChunk(Number(row.dataset.rowIndex));
                if (!chunk) { hideChangeTooltip(); return; }
                if (tooltipChunk === chunk && !changeTooltip.hidden) {
                    tooltipRow?.removeAttribute('aria-describedby');
                    tooltipRow = row;
                    row.setAttribute('aria-describedby', 'change-tooltip');
                    return;
                }
                hideChangeTooltip();
                tooltipRow = row;
                tooltipChunk = chunk;
                tooltipShowTimer = setTimeout(() => showChangeTooltip(row, chunk), 400);
            });
            view.addEventListener('pointerout', event => {
                const row = event.target.closest('.diff-row');
                if (row && !row.contains(event.relatedTarget)) scheduleTooltipHide();
            });
        }
        changeTooltip.addEventListener('pointerenter', () => clearTimeout(tooltipHideTimer));
        changeTooltip.addEventListener('pointerleave', scheduleTooltipHide);
        verticalWrapper.addEventListener('pointerdown', hideChangeTooltip);
        window.addEventListener('blur', hideChangeTooltip);
        window.addEventListener('keydown', event => {
            if (event.key === 'Escape') hideChangeTooltip();
        });

        function renderChunkActions() {
            const actions = document.getElementById('chunk-actions');
            if (!comparisonData?.canRevert || !comparisonData.revertChunkTooltip) {
                actions.replaceChildren();
                chunkButtons.clear();
                return;
            }
            const top = verticalWrapper.scrollTop;
            const bottom = top + verticalWrapper.clientHeight;
            let low = 0;
            let high = diffChunks.length;
            while (low < high) {
                const middle = (low + high) >>> 1;
                if ((diffChunks[middle].rowEnd + 1) * rowHeight <= top) low = middle + 1;
                else high = middle;
            }
            const visible = new Set();
            for (let index = low; index < diffChunks.length; index++) {
                const chunk = diffChunks[index];
                const start = chunk.rowStart * rowHeight;
                const end = (chunk.rowEnd + 1) * rowHeight;
                if (start >= bottom) break;
                visible.add(index);
                const existing = chunkButtons.get(index);
                if (existing) {
                    existing.style.top = `${Math.min(end - rowHeight, Math.max(start, top))}px`;
                    existing.disabled = revertPending;
                    continue;
                }
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'revert-chunk-btn';
                button.textContent = '↶';
                button.title = comparisonData.revertChunkTooltip;
                button.setAttribute('aria-label', comparisonData.revertChunkTooltip);
                button.style.top = `${Math.min(end - rowHeight, Math.max(start, top))}px`;
                button.disabled = revertPending;
                button.addEventListener('click', () => {
                    if (revertPending) return;
                    revertPending = true;
                    actions.querySelectorAll('button').forEach(item => { item.disabled = true; });
                    document.getElementById('diff-message').hidden = true;
                    post({ type: 'revertChunk', revision: comparisonData.revision,
                        originalStart: chunk.originalStart, originalCount: chunk.originalCount,
                        modifiedStart: chunk.modifiedStart, modifiedCount: chunk.modifiedCount });
                });
                actions.append(button);
                chunkButtons.set(index, button);
            }
            for (const [index, button] of chunkButtons) {
                if (!visible.has(index)) {
                    button.remove();
                    chunkButtons.delete(index);
                }
            }
        }

        function renderLineText(item) {
            if (!item.changes) return escapeHtml(item.text);
            let html = '';
            let offset = 0;
            for (const [start, end] of item.changes) {
                html += escapeHtml(item.text.slice(offset, start));
                html += `<span class="inline-change">${escapeHtml(item.text.slice(start, end))}</span>`;
                offset = end;
            }
            return html + escapeHtml(item.text.slice(offset));
        }

        // ── Scrollmap helpers ──────────────────────────────────────────────
        function buildScrollmapMarkers(scrollmap, diffArray, markerClass) {
            scrollmap.querySelectorAll('.scrollmap-marker').forEach(el => el.remove());

            const mapH = scrollmap.clientHeight;
            const totalH = diffArray.length * rowHeight;
            if (totalH === 0 || mapH === 0) return;

            const scale = mapH / totalH;
            const bands = [];
            let currentBand = null;

            for (let k = 0; k < diffArray.length; k++) {
                const item = diffArray[k];
                if (item.type === markerClass) {
                    const top = k * rowHeight * scale;
                    const height = Math.max(rowHeight * scale, 1.5);
                    const bottom = top + height;

                    if (currentBand && top <= currentBand.bottom + 1) {
                        currentBand.bottom = Math.max(currentBand.bottom, bottom);
                    } else {
                        if (currentBand) {
                            bands.push(currentBand);
                        }
                        currentBand = { top, bottom };
                    }
                } else {
                    if (currentBand) {
                        bands.push(currentBand);
                        currentBand = null;
                    }
                }
            }
            if (currentBand) {
                bands.push(currentBand);
            }

            const thumb = scrollmap.querySelector('.scrollmap-thumb');
            bands.forEach(band => {
                const marker = document.createElement('div');
                marker.className = `scrollmap-marker ${markerClass}`;
                marker.style.top = `${band.top}px`;
                marker.style.height = `${Math.max(band.bottom - band.top, 2)}px`;
                scrollmap.insertBefore(marker, thumb);
            });
        }

        function updateScrollmapThumb(wrapper, scrollmap, thumb) {
            const mapH   = scrollmap.clientHeight;
            const totalH = globalDiffA.length * rowHeight;
            if (totalH === 0 || mapH === 0) return;

            const viewH   = wrapper.clientHeight;
            const scrollY = wrapper.scrollTop;
            const thumbH = Math.min(mapH, Math.max(viewH * mapH / totalH, 8));
            const maxScroll = Math.max(0, totalH - viewH);
            const thumbTop = maxScroll > 0 ? scrollY / maxScroll * (mapH - thumbH) : 0;

            thumb.style.top    = `${thumbTop}px`;
            thumb.style.height = `${thumbH}px`;
        }

        function attachScrollmapInput(scrollmap, wrapper, thumb) {
            let dragMetrics = null;
            let dragOffset = 0;
            function scrollToRatio(clientY) {
                if (!dragMetrics || dragMetrics.trackHeight <= 0) return;
                const ratio = Math.min(Math.max(
                    (clientY - dragMetrics.top - dragOffset) / dragMetrics.trackHeight, 0), 1);
                wrapper.scrollTop = ratio * dragMetrics.maxScroll;
            }

            let dragging = false;
            scrollmap.addEventListener('mousedown', e => {
                const rect = scrollmap.getBoundingClientRect();
                const totalH = globalDiffA.length * rowHeight;
                if (rect.height <= 0 || totalH <= wrapper.clientHeight) return;
                const thumbH = Math.min(rect.height,
                    Math.max(wrapper.clientHeight * rect.height / totalH, 8));
                const maxScroll = totalH - wrapper.clientHeight;
                const trackHeight = rect.height - thumbH;
                const thumbTop = wrapper.scrollTop / maxScroll * trackHeight;
                const pointerY = e.clientY - rect.top;
                dragOffset = pointerY >= thumbTop && pointerY <= thumbTop + thumbH
                    ? pointerY - thumbTop : thumbH / 2;
                // Measure once at drag start, not after every scroll/style write.
                dragMetrics = { top: rect.top, trackHeight, maxScroll };
                dragging = true;
                scrollToRatio(e.clientY);
                e.preventDefault();
            });
            window.addEventListener('mousemove', e => {
                if (dragging) scrollToRatio(e.clientY);
            });
            window.addEventListener('mouseup', () => { dragging = false; dragMetrics = null; });
        }

        // ── List Virtualization Logic ──────────────────────────────────────
        let renderedStartIndex = 0;
        let renderedEndIndex = -1;

        function createDiffRow(item, rowIndex) {
            const row = document.createElement('div');
            const changed = item.type === 'added' || item.type === 'removed';
            row.className = 'diff-row' + (item.type === 'unchanged' ? '' : ` row-${item.type}`);
            if (item.type !== 'unchanged') row.dataset.rowIndex = rowIndex;
            const sign = item.type === 'added' ? '+ ' : (item.type === 'removed' ? '- ' : '  ');
            const content = item.type === 'empty' ? '' :
                `<span class="diff-sign">${sign}</span>${changed ? renderLineText(item) : escapeHtml(item.text)}`;
            row.innerHTML = `<div class="line-number">${item.lineNum || ''}</div><div class="line-content">${content}</div>`;
            return row;
        }

        function updateVisibleRows(view, items, startIndex, endIndex, force) {
            function fragment(start, end) {
                const result = document.createDocumentFragment();
                for (let k = start; k <= end; k++) result.append(createDiffRow(items[k], k));
                return result;
            }
            if (force || renderedEndIndex < startIndex || renderedStartIndex > endIndex) {
                view.replaceChildren(fragment(startIndex, endIndex));
                return;
            }
            // Only remove offscreen rows and add the newly exposed edges.
            // The overlapping rows retain their DOM nodes and text selection.
            for (let k = renderedStartIndex; k < startIndex; k++) view.firstElementChild.remove();
            for (let k = renderedEndIndex; k > endIndex; k--) view.lastElementChild.remove();
            if (startIndex < renderedStartIndex) view.prepend(fragment(startIndex, renderedStartIndex - 1));
            if (endIndex > renderedEndIndex) view.append(fragment(renderedEndIndex + 1, endIndex));
        }

        function renderVisibleRows(force = false) {
            renderChunkActions();
            const totalRows = globalDiffA.length;
            const viewHeight = verticalWrapper.clientHeight;
            const scrollTop = verticalWrapper.scrollTop;

            const firstVisible = Math.max(0, Math.floor(scrollTop / rowHeight));
            const lastVisible = Math.min(totalRows - 1, Math.ceil((scrollTop + viewHeight) / rowHeight) - 1);
            // Keep a viewport-sized buffer and reuse it until nearing its edge.
            if (!force && renderedStartIndex <= Math.max(0, firstVisible - 5) &&
                renderedEndIndex >= Math.min(totalRows - 1, lastVisible + 5)) return;
            const bufferRows = Math.max(20, Math.ceil(viewHeight / rowHeight));
            const startIndex = Math.max(0, firstVisible - bufferRows);
            const endIndex = Math.min(totalRows - 1, lastVisible + bufferRows);
            updateVisibleRows(leftView, globalDiffA, startIndex, endIndex, force);
            updateVisibleRows(rightView, globalDiffB, startIndex, endIndex, force);
            renderedStartIndex = startIndex;
            renderedEndIndex = endIndex;

            applyViewTransforms();
        }

        function applyViewTransforms() {
            const scale = window.devicePixelRatio || 1;
            const paintedOffset = Math.round(horizontalOffset * scale) / scale;
            const transform = `translate3d(${-paintedOffset}px, ${renderedStartIndex * rowHeight}px, 0)`;
            leftView.style.transform = transform;
            rightView.style.transform = transform;
        }

        function setHorizontalOffset(value) {
            if (value !== horizontalOffset) hideChangeTooltip();
            horizontalOffset = Math.min(horizontalMax, Math.max(0, value));
            // Paint the thumbs and glyphs in the same input event; there is no
            // asynchronous native scroll event or follower feedback to wait for.
            for (const [scrollbar, metrics] of horizontalMetrics) {
                const x = horizontalMax > 0 ? horizontalOffset / horizontalMax * metrics.travel : 0;
                metrics.thumb.style.transform = `translate3d(${x}px, 0, 0)`;
                scrollbar.setAttribute('aria-valuenow', String(Math.round(horizontalOffset)));
            }
            applyViewTransforms();
        }

        function sizeHorizontalScrollbar(scrollbar, thumb, viewport) {
            const width = scrollbar.clientWidth;
            const thumbWidth = Math.min(width, Math.max(20,
                viewport.clientWidth * width / Math.max(1, viewport.clientWidth + horizontalMax)));
            thumb.style.width = `${thumbWidth}px`;
            scrollbar.setAttribute('aria-valuemax', String(Math.round(horizontalMax)));
            horizontalMetrics.set(scrollbar, { thumb, travel: Math.max(0, width - thumbWidth), thumbWidth });
        }

        function updateSpacerWidths() {
            const font = getComputedStyle(leftView);
            const fontKey = `${font.fontSize} ${font.fontFamily}`;
            if (fontKey !== measuredFont) {
                const context = document.createElement('canvas').getContext('2d');
                measuredContentWidth = maxLineLength * charWidth + 100;
                if (context) {
                    context.font = fontKey;
                    const tabWidth = Math.max(1, context.measureText(' ').width * 8);
                    const signWidth = context.measureText('  ').width;
                    let widest = 0;
                    function measure(text) {
                        let width = signWidth;
                        const parts = text.split('\t');
                        for (let i = 0; i < parts.length; i++) {
                            if (i > 0) width = (Math.floor(width / tabWidth) + 1) * tabWidth;
                            width += context.measureText(parts[i]).width;
                        }
                        return width;
                    }
                    for (let k = 0; k < globalDiffA.length; k++) {
                        widest = Math.max(widest, measure(globalDiffA[k].text), measure(globalDiffB[k].text));
                    }
                    measuredContentWidth = Math.ceil(widest + 100);
                }
                measuredFont = fontKey;
            }
            // Size against the whole comparison, including tabs and wide glyphs,
            // so viewport changes cannot change the scrollbar's range mid-drag.
            const minWidth = Math.max(leftWrapper.clientWidth, rightWrapper.clientWidth);
            const finalWidth = Math.max(minWidth, measuredContentWidth);
            const widthPx = `${finalWidth}px`;

            leftView.style.width = widthPx;
            rightView.style.width = widthPx;
            horizontalMax = Math.max(0, finalWidth - Math.min(leftWrapper.clientWidth, rightWrapper.clientWidth));
            // Each thumb has its own track geometry, but the text offset and
            // maximum remain shared even when the pane widths differ.
            sizeHorizontalScrollbar(leftHorizontal, leftHorizontalThumb, leftWrapper);
            sizeHorizontalScrollbar(rightHorizontal, rightHorizontalThumb, rightWrapper);
            setHorizontalOffset(horizontalOffset);
        }

        // ── Render ─────────────────────────────────────────────────────────
        function renderDiff(data) {
            hideChangeTooltip();
            comparisonData = data;
            revertPending = false;
            document.getElementById('chunk-actions').replaceChildren();
            chunkButtons.clear();
            document.getElementById('diff-message').hidden = true;
            const lineDiff = computeLineDiff(data.textA, data.textB);
            const { diffA, diffB } = alignChangedLines(lineDiff.diffA, lineDiff.diffB);
            globalDiffA = diffA;
            globalDiffB = diffB;
            diffChunks = buildDiffChunks(diffA, diffB);
            measuredFont = '';

            // Compute maximum line length
            maxLineLength = 0;
            for (let k = 0; k < diffA.length; k++) {
                if (diffA[k].text.length > maxLineLength) maxLineLength = diffA[k].text.length;
                if (diffB[k].text.length > maxLineLength) maxLineLength = diffB[k].text.length;
            }

            // Update title
            const diffTitleEl = document.getElementById('diff-title');
            if (diffTitleEl && data.compareToolTitle) {
                diffTitleEl.textContent = data.compareToolTitle;
            }

            const prefixA = data.originalPrefix || '원본: ';
            const prefixB = data.modifiedPrefix || '수정본: ';
            const defaultLabelA = data.originalFileLabel || '원본 파일 (Original)';
            const defaultLabelB = data.modifiedFileLabel || '비교 대상 파일 (Modified)';

            document.getElementById('left-header').textContent  = `${prefixA}${data.titleA || defaultLabelA}`;
            const rightHeaderText = document.getElementById('right-header-text');
            if (rightHeaderText) {
                rightHeaderText.textContent = `${prefixB}${data.titleB || defaultLabelB}`;
            }

            // Store pathB and tooltip for open file button
            rightFilePath = data.pathB || '';
            const openBtn = document.getElementById('right-open-btn');
            if (openBtn && data.openFileTooltip) {
                openBtn.title = data.openFileTooltip;
            }

            // One canvas owns the scroll height for both panes.
            const totalHeight = diffA.length * rowHeight;
            diffCanvas.style.height = `${totalHeight}px`;

            updateSpacerWidths();
            const maxScrollTop = Math.max(0, totalHeight - verticalWrapper.clientHeight);
            if (verticalWrapper.scrollTop > maxScrollTop) verticalWrapper.scrollTop = maxScrollTop;

            // Calculate diff stats
            let additions = 0;
            let deletions = 0;
            for (let k = 0; k < diffA.length; k++) {
                if (diffA[k].type === 'removed') deletions++;
                if (diffB[k].type === 'added') additions++;
            }

            const formatStr = data.diffStatsFormat || '변경사항: 추가 {0}줄, 삭제 {1}줄';
            document.getElementById('diff-stats').textContent = formatStr
                .replace('{0}', additions)
                .replace('{1}', deletions);

            // Initial render
            renderVisibleRows(true);
            lastPaintedScrollTop = verticalWrapper.scrollTop;

            requestAnimationFrame(() => {
                buildScrollmapMarkers(leftScrollmap,  globalDiffA,  'removed');
                buildScrollmapMarkers(rightScrollmap, globalDiffB, 'added');
                updateScrollmapThumb(verticalWrapper, leftScrollmap, leftThumb);
                updateScrollmapThumb(verticalWrapper, rightScrollmap, rightThumb);
            });
        }

        function escapeHtml(value) {
            return (value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ── Shared vertical scrolling ──────────────────────────────────────
        let scrollRenderPending = false;
        let lastPaintedScrollTop = 0;

        function onScroll() {
            if (scrollRenderPending || verticalWrapper.scrollTop === lastPaintedScrollTop) return;
            hideChangeTooltip();
            scrollRenderPending = true;
            requestAnimationFrame(() => {
                scrollRenderPending = false;
                renderVisibleRows();
                updateScrollmapThumb(verticalWrapper, leftScrollmap, leftThumb);
                updateScrollmapThumb(verticalWrapper, rightScrollmap, rightThumb);
                lastPaintedScrollTop = verticalWrapper.scrollTop;
            });
        }

        verticalWrapper.addEventListener('scroll', () => {
            if (verticalWrapper.scrollLeft !== 0) {
                const delta = verticalWrapper.scrollLeft;
                verticalWrapper.scrollLeft = 0;
                setHorizontalOffset(horizontalOffset + delta);
            }
            onScroll();
        });

        function attachHorizontalScrollInput(scrollbar, viewport) {
            let drag = null;
            function move(clientX) {
                if (!drag || drag.travel <= 0) return;
                const ratio = Math.min(1, Math.max(0, (clientX - drag.left - drag.grabOffset) / drag.travel));
                setHorizontalOffset(ratio * drag.max);
            }
            scrollbar.addEventListener('pointerdown', event => {
                if (event.button !== 0 || horizontalMax <= 0) return;
                const metrics = horizontalMetrics.get(scrollbar);
                const rect = scrollbar.getBoundingClientRect();
                const thumbLeft = horizontalOffset / horizontalMax * metrics.travel;
                const x = event.clientX - rect.left;
                const grabOffset = x >= thumbLeft && x <= thumbLeft + metrics.thumbWidth
                    ? x - thumbLeft : metrics.thumbWidth / 2;
                drag = { left: rect.left, travel: metrics.travel, grabOffset, max: horizontalMax };
                scrollbar.focus({ preventScroll: true });
                scrollbar.setPointerCapture(event.pointerId);
                move(event.clientX);
                event.preventDefault();
            });
            scrollbar.addEventListener('pointermove', event => { if (drag) move(event.clientX); });
            for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
                scrollbar.addEventListener(name, () => { drag = null; });
            }
            scrollbar.addEventListener('keydown', event => {
                const page = viewport.clientWidth * 0.9;
                let value;
                switch (event.key) {
                    case 'ArrowLeft': value = horizontalOffset - 30; break;
                    case 'ArrowRight': value = horizontalOffset + 30; break;
                    case 'PageUp': value = horizontalOffset - page; break;
                    case 'PageDown': value = horizontalOffset + page; break;
                    case 'Home': value = 0; break;
                    case 'End': value = horizontalMax; break;
                    default: return;
                }
                setHorizontalOffset(value);
                event.preventDefault();
            });
        }
        attachHorizontalScrollInput(leftHorizontal, leftWrapper);
        attachHorizontalScrollInput(rightHorizontal, rightWrapper);

        function onHorizontalWheel(event, wrapper, scrollbarOnly = false) {
            if (event.ctrlKey) return;
            const delta = event.deltaX || (event.shiftKey ? event.deltaY : 0);
            if (!delta) {
                if (scrollbarOnly && event.deltaY) {
                    const unit = event.deltaMode === 1 ? rowHeight : (event.deltaMode === 2 ? verticalWrapper.clientHeight : 1);
                    verticalWrapper.scrollTop += event.deltaY * unit;
                    event.preventDefault();
                }
                return;
            }
            const horizontalUnit = event.deltaMode === 1 ? rowHeight : (event.deltaMode === 2 ? wrapper.clientWidth : 1);
            setHorizontalOffset(horizontalOffset + delta * horizontalUnit);
            if (!event.shiftKey && event.deltaY) {
                const verticalUnit = event.deltaMode === 1 ? rowHeight : (event.deltaMode === 2 ? verticalWrapper.clientHeight : 1);
                verticalWrapper.scrollTop += event.deltaY * verticalUnit;
            }
            event.preventDefault();
        }
        leftWrapper.addEventListener('wheel', event => onHorizontalWheel(event, leftWrapper), { passive: false });
        rightWrapper.addEventListener('wheel', event => onHorizontalWheel(event, rightWrapper), { passive: false });
        leftHorizontal.addEventListener('wheel', event => onHorizontalWheel(event, leftWrapper, true), { passive: false });
        rightHorizontal.addEventListener('wheel', event => onHorizontalWheel(event, rightWrapper, true), { passive: false });
        leftScrollmap.addEventListener('wheel', event => onHorizontalWheel(event, leftWrapper, true), { passive: false });
        rightScrollmap.addEventListener('wheel', event => onHorizontalWheel(event, rightWrapper, true), { passive: false });

        // Scrollmap click/drag
        attachScrollmapInput(leftScrollmap, verticalWrapper, leftThumb);
        attachScrollmapInput(rightScrollmap, verticalWrapper, rightThumb);

        // Rebuild on resize
        const resizeObs = new ResizeObserver(() => {
            hideChangeTooltip();
            updateSpacerWidths();
            renderVisibleRows();
            buildScrollmapMarkers(leftScrollmap,  globalDiffA,  'removed');
            buildScrollmapMarkers(rightScrollmap, globalDiffB, 'added');
            updateScrollmapThumb(verticalWrapper, leftScrollmap, leftThumb);
            updateScrollmapThumb(verticalWrapper, rightScrollmap, rightThumb);
        });
        resizeObs.observe(leftScrollmap);
        resizeObs.observe(rightScrollmap);
        resizeObs.observe(leftWrapper);
        resizeObs.observe(verticalWrapper);

        function applyThemeSettings(theme, uiFontFamily, editorFontFamily) {
            const bg    = theme === 'PastelDark' ? '#24273a' : (theme === 'Light' ? '#ffffff' : '#1e1e1e');
            const fg    = theme === 'PastelDark' ? '#cad3f5' : (theme === 'Light' ? '#1a1a1a' : '#d4d4d4');
            const empty = theme === 'PastelDark' ? '#181926' : (theme === 'Light' ? '#f9f9f9' : '#171717');
            
            document.documentElement.style.setProperty('--bg',         bg);
            document.documentElement.style.setProperty('--fg',         fg);
            document.documentElement.style.setProperty('--empty-bg',   empty);
            document.documentElement.style.setProperty('--header-bg',  theme === 'PastelDark' ? '#1e2030' : (theme === 'Light' ? '#f3f3f3' : '#252526'));
            document.documentElement.style.setProperty('--gutter-bg',  theme === 'PastelDark' ? '#1e2030' : (theme === 'Light' ? '#f3f3f3' : '#1e1e1e'));
            document.documentElement.style.setProperty('--border',     theme === 'PastelDark' ? '#36394f' : (theme === 'Light' ? '#e1e4e8' : '#3e3e3e'));
            
            if (uiFontFamily) {
                document.documentElement.style.setProperty('--ui-font',    uiFontFamily);
            }
            if (editorFontFamily) {
                document.documentElement.style.setProperty('--font-family', editorFontFamily);
                updateSpacerWidths();
            }

            const addedText   = theme === 'PastelDark' ? '#a6da95' : (theme === 'Light' ? '#22863a' : '#3fb950');
            const removedText = theme === 'PastelDark' ? '#ed8796' : (theme === 'Light' ? '#cb2431' : '#f85149');
            document.documentElement.style.setProperty('--added-text',   addedText);
            document.documentElement.style.setProperty('--removed-text', removedText);
            document.documentElement.style.setProperty('--added-change-bg',
                theme === 'PastelDark' ? 'rgba(166, 218, 149, 0.3)' :
                    (theme === 'Light' ? 'rgba(46, 160, 67, 0.3)' : 'rgba(46, 160, 67, 0.4)'));
            document.documentElement.style.setProperty('--removed-change-bg',
                theme === 'PastelDark' ? 'rgba(237, 135, 150, 0.3)' :
                    (theme === 'Light' ? 'rgba(248, 81, 73, 0.3)' : 'rgba(248, 81, 73, 0.4)'));
        }

        // ── WebView2 IPC ───────────────────────────────────────────────────
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', event => {
                const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                if (msg.action === 'compare') {
                    if (msg.statsGathering) {
                        document.getElementById('diff-stats').textContent = msg.statsGathering;
                    }
                    applyThemeSettings(msg.theme || 'Dark', msg.uiFontFamily, null);
                    renderDiff(msg);
                } else if (msg.action === 'revertChunkResult') {
                    if (!comparisonData || msg.requestRevision !== comparisonData.revision) return;
                    revertPending = false;
                    if (msg.success) {
                        renderDiff({ ...comparisonData, textB: msg.textB, revision: msg.revision });
                    } else {
                        const message = document.getElementById('diff-message');
                        message.textContent = msg.error || '';
                        message.title = message.textContent;
                        message.hidden = false;
                        renderChunkActions();
                    }
                } else if (msg.action === 'updateOptions') {
                    applyThemeSettings(msg.theme || 'Dark', null, msg.fontFamily);
                }
            });
        }
    </script>
</body>
</html>
